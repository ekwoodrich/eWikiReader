name: Signed Build & Publish

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - dev

concurrency:
  group: ewikireader-signed-publish
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish signed eWikiReader APK
    if: >-
      github.event.pull_request.merged == true && (
        (github.event.pull_request.base.ref == 'main' && (
          contains(github.event.pull_request.labels.*.name, 'release') ||
          contains(github.event.pull_request.labels.*.name, 'release:patch') ||
          contains(github.event.pull_request.labels.*.name, 'release:minor') ||
          contains(github.event.pull_request.labels.*.name, 'release:major') ||
          contains(github.event.pull_request.labels.*.name, 'release:replace') ||
          contains(github.event.pull_request.labels.*.name, 'release:patch:replace') ||
          contains(github.event.pull_request.labels.*.name, 'release:minor:replace') ||
          contains(github.event.pull_request.labels.*.name, 'release:major:replace')
        )) ||
        (github.event.pull_request.base.ref == 'dev' &&
          contains(github.event.pull_request.labels.*.name, 'dev-build'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version and generate changelog notes
        id: version
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [ "$BASE_BRANCH" = "dev" ]; then
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            NEW_TAG="dev-${SHORT_SHA}"
            printf 'Development build from commit `%s`.\n\n' "$(git rev-parse HEAD)" > "${RUNNER_TEMP}/release_notes.md"
            BASE_TAG=$(git tag -l "v*" --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+(-release|-eink)?$/{print; exit}')
            LOG_RANGE="HEAD"
            if [ -n "$BASE_TAG" ]; then LOG_RANGE="${BASE_TAG}..HEAD"; fi
            git log "$LOG_RANGE" --no-merges --pretty=format:'- %s' >> "${RUNNER_TEMP}/release_notes.md"
            {
              echo "is_dev=true"
              echo "new_version=${NEW_TAG}"
              echo "new_tag=${NEW_TAG}"
              echo "version_code=$(git rev-list --count HEAD)"
              echo "apk_name=eWikiReader-${NEW_TAG}.apk"
              echo "release_name=${NEW_TAG}"
              echo "is_replace=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IS_REPLACE=$(echo "$PR_LABELS" | jq -r 'any(.[]; . == "release:replace" or endswith(":replace"))')
          if [ "$IS_REPLACE" = "true" ]; then
            echo "Replacement release requested."
          fi

          if echo "$PR_LABELS" | jq -e 'index("release:major") != null or index("release:major:replace") != null' >/dev/null; then
            BUMP_TYPE="major"
          elif echo "$PR_LABELS" | jq -e 'index("release:minor") != null or index("release:minor:replace") != null' >/dev/null; then
            BUMP_TYPE="minor"
          elif echo "$PR_LABELS" | jq -e 'index("release:patch") != null or index("release:patch:replace") != null or index("release") != null or index("release:replace") != null' >/dev/null; then
            BUMP_TYPE="patch"
          else
            echo "No release label found on PR. Exiting."
            exit 1
          fi

          LAST_TAG=$(git tag -l "v*" --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+(-release|-eink)?$/{print; exit}')
          if [ "$IS_REPLACE" = "true" ] && [ -z "$LAST_TAG" ]; then
            echo "Cannot replace a release because no prior stable version tag exists."
            exit 1
          fi
          if [ -z "$LAST_TAG" ]; then
            echo "No prior stable tag found; initializing baseline as v0.99.0-release"
            LAST_TAG="v0.99.0-release"
          fi
          echo "Previous tag: $LAST_TAG (increment: $BUMP_TYPE)"

          BASE_VERSION="${LAST_TAG#v}"
          BASE_VERSION="${BASE_VERSION%-release}"
          BASE_VERSION="${BASE_VERSION%-eink}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          if [ "$IS_REPLACE" = "true" ]; then
            NEW_VERSION="$BASE_VERSION"
            NEW_TAG="v${NEW_VERSION}-release"
          else
            case "$BUMP_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            NEW_TAG="v${NEW_VERSION}-release"
          fi
          VERSION_CODE=$(git rev-list --count HEAD)
          APK_NAME="eWikiReader-v${NEW_VERSION}.apk"

          echo "New version: $NEW_VERSION (tag: $NEW_TAG, versionCode: $VERSION_CODE)"

          if git rev-parse "${LAST_TAG}^{commit}" >/dev/null 2>&1; then
            LOG_RANGE="${LAST_TAG}..HEAD"
          else
            LOG_RANGE="HEAD"
          fi

          NOTES=$(git log "$LOG_RANGE" --no-merges --pretty=format:"%s" \
            | grep -E '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([^)]+\))?!?: ' \
            | sed 's/^/- /' || true)

          if [ -z "$NOTES" ]; then
            NOTES=$(git log "$LOG_RANGE" --no-merges --pretty=format:"- %s" || true)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="- Release ${NEW_TAG}"
          fi

          printf "%s\n" "$NOTES" > "${RUNNER_TEMP}/release_notes.md"

          {
            echo "is_dev=false"
            echo "is_replace=${IS_REPLACE}"
            echo "last_tag=${LAST_TAG}"
            echo "new_version=${NEW_VERSION}"
            echo "new_tag=${NEW_TAG}"
            echo "version_code=${VERSION_CODE}"
            echo "apk_name=${APK_NAME}"
            echo "release_name=v${NEW_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: ${name}"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/ewikireader-release.jks"

      - name: Compile and package release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ewikireader-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-configuration-cache assembleRelease \
            -PversionName="${{ steps.version.outputs.new_version }}" \
            -PversionCode="${{ steps.version.outputs.version_code }}"
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk_name }}"
          ls -lh "${{ steps.version.outputs.apk_name }}"

      - name: Update CHANGELOG.md and commit to main
        if: steps.version.outputs.is_dev != 'true'
        run: |
          set -euo pipefail
          RELEASE_DATE=$(date -u +"%Y-%m-%d")
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          TMP_CHANGELOG="${RUNNER_TEMP}/CHANGELOG.md.tmp"
          EXISTING_SECTIONS="${RUNNER_TEMP}/existing_changelog_sections.md"

          if [ "${{ steps.version.outputs.is_replace }}" = "true" ] && [ -f CHANGELOG.md ]; then
            awk -v old_target="## [${LAST_TAG}]" -v new_target="## [${NEW_TAG}]" '
              /^## \[/ {
                if (index($0, old_target) == 1 || index($0, new_target) == 1) { skip=1; next }
                skip=0
                found=1
              }
              found && !skip { print }
            ' CHANGELOG.md > "$EXISTING_SECTIONS"
          elif [ -f CHANGELOG.md ]; then
            awk 'found { print } /^## \[/ { found=1; print }' CHANGELOG.md > "$EXISTING_SECTIONS"
          else
            : > "$EXISTING_SECTIONS"
          fi

          {
            echo "# Changelog"
            echo ""
            echo "All notable changes to the **eWikiReader** fork are documented in this file."
            echo ""
            echo "## [${NEW_TAG}] - ${RELEASE_DATE}"
            echo ""
            cat "$NOTES_FILE"
            echo ""
            cat "$EXISTING_SECTIONS"
          } > "$TMP_CHANGELOG"

          mv "$TMP_CHANGELOG" CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): update CHANGELOG.md for ${NEW_TAG} [skip ci]"
          git push origin HEAD:main

      - name: Tag release commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          if [ "${{ steps.version.outputs.is_replace }}" = "true" ]; then
            git tag -fa "$NEW_TAG" -m "Replace release $NEW_TAG"
            git push --force origin "$NEW_TAG"
            if [ "$NEW_TAG" != "${{ steps.version.outputs.last_tag }}" ] && \
              git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.last_tag }}" >/dev/null; then
              git push origin --delete "${{ steps.version.outputs.last_tag }}"
            fi
          else
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
            git push origin "$NEW_TAG"
          fi

      - name: Remove previous GitHub Release before replacement
        if: steps.version.outputs.is_replace == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OLD_TAG="${{ steps.version.outputs.last_tag }}"
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          for TAG in "$OLD_TAG" "$NEW_TAG"; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" --yes
            else
              echo "No existing GitHub Release for $TAG."
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.release_name }}
          body_path: ${{ runner.temp }}/release_notes.md
          files: ${{ steps.version.outputs.apk_name }}
          prerelease: ${{ steps.version.outputs.is_dev == 'true' }}
          make_latest: ${{ steps.version.outputs.is_dev == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/ewikireader-release.jks"
